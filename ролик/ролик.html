<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Светофор наряда · индекс риска</title>
<!-- Шрифты — локально (vendor/), без интернета. В наборе нет казахских Қ/ғ и знаков ≈ → —
     для них в стеках указан системный запасной шрифт (Segoe UI), он одинаков на каждом кадре. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
/* =====================================================================
   Ролик «Светофор наряда» (индекс риска работ повышенной опасности).
   Каркас — шаблон/ролик.html: всё в кадре — HTML/CSS/SVG, время — аргумент renderAt(t).
   ===================================================================== */
:root{ --ui-bg:#141414; --ui-panel:#1b1b1b; --ui-fg:#e9e9e9; --ui-dim:#8b8b8b; --ui-line:#2e2e2e;
  /* палитра прототипа KMG-HSE-RISK (стиль.css) */
  --бумага:#F5F9FC; --чернила:#231F20; --второй:#55606B; --линия:#CFDCE6;
  --кмг:#02AEF0; --кмг-тёмный:#0089C4; --кмг-свет:#90D6F7; --кмг-фон:#E6F6FD;
  --зелёный:#1B8A4C; --зелёный-фон:#E6F4EC; --янтарь:#D98E04; --янтарь-фон:#FFF4DB; --красный:#C8102E; --красный-фон:#FDE8EB;
  --т:"Onest","Segoe UI",sans-serif; --з:"Inter Tight","Segoe UI",sans-serif; --п:"Jost","Segoe UI",sans-serif; --м:"JetBrains Mono","Segoe UI",monospace; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ui-bg);color:var(--ui-fg);font:13px/1.45 "JetBrains Mono",ui-monospace,monospace;overflow:hidden}

/* ---------- Плеер (в рендере скрыт) ---------- */
.app{display:flex;flex-direction:column;height:100%;gap:14px;padding:16px;align-items:center;justify-content:center}
.stage-wrap{position:relative;flex:none;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--ui-line),0 24px 70px rgba(0,0,0,.55)}
.panel{width:min(1200px,100%);flex:none;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:10px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center}
.time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.time small{font-size:12px;color:var(--ui-dim);font-weight:500}
input[type=range]{width:100%;accent-color:#fff}
.btns,.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--ui-fg);background:#262626;border:1px solid #3a3a3a;border-radius:6px;padding:6px 10px;cursor:pointer}
button.on{background:var(--ui-fg);color:#111}
.chips span{padding:4px 8px;border:1px solid #333;border-radius:5px;cursor:pointer;color:var(--ui-dim)}
.chips span.on{color:#fff;border-color:#888}
body.render .app{display:block;padding:0}
body.render .panel{display:none}
body.render .stage-wrap{border-radius:0;box-shadow:none}

/* ---------- Сцена 1920×1080 ---------- */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000;color:var(--чернила);font-family:var(--т)}
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:29}
.item{position:absolute;inset:0;display:none;overflow:hidden;background:var(--bg)}  /* фон под уходящей (уменьшенной) сценой — без чёрной рамки */
.item.on{display:block}
.world{position:absolute;inset:0;background:var(--bg);perspective:2600px;perspective-origin:50% 45%}
.rig{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 50%}
/* подпись сцены внизу и метка «02 / 08 · …» сверху — общие для всех сцен */
#tag{position:absolute;left:110px;bottom:56px;z-index:35;display:flex;align-items:center;gap:20px;color:#231F20}
#tag i{width:8px;height:42px;border-radius:3px;background:#02AEF0}
#tag b{font:700 36px var(--п);letter-spacing:-.005em}
#метка{position:absolute;left:110px;top:54px;z-index:35;font:500 18px var(--м);letter-spacing:.12em;text-transform:uppercase}
.лого-угол{position:absolute;right:90px;top:46px;height:40px}

/* ---------- UI-кит: окна и элементы прототипа (белые окна с рамкой #231F20) ---------- */
.abs{position:absolute}
.win{position:absolute;border-radius:12px;overflow:hidden;background:#fff;color:var(--чернила);border:2px solid var(--чернила);box-shadow:0 34px 70px rgba(9,46,80,.14)}
.wbar{height:54px;display:flex;align-items:center;gap:12px;padding:0 20px;font:600 20px var(--т);border-bottom:2px solid var(--линия);white-space:nowrap}
.wbar i{flex:none;width:26px;height:26px;border-radius:6px;background:var(--кмг-свет);border:2px solid var(--чернила)}
.wbar .sp{flex:1}
.плашка{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:6px;font:600 15px var(--т);background:var(--кмг-фон);color:var(--кмг-тёмный);border:2px solid var(--кмг);white-space:nowrap}
.плашка::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--кмг)}
.card{position:absolute;border-radius:12px;padding:24px 28px;background:#fff;color:var(--чернила);border:2px solid var(--чернила);box-shadow:0 34px 70px rgba(9,46,80,.16)}
.k-lbl{font:700 16px var(--п);letter-spacing:.1em;text-transform:uppercase;color:var(--второй)}
.k-val{font:900 64px/1 var(--з);letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:9px;padding:4px 14px 4px 10px;border-radius:999px;font:600 17px var(--т);border:2px solid currentColor;white-space:nowrap}
.chip::before{content:'';width:13px;height:13px;border-radius:50%;background:currentColor}
.chip.к{color:var(--красный);background:var(--красный-фон)} .chip.ж{color:var(--янтарь);background:var(--янтарь-фон)}
.chip.з{color:var(--зелёный);background:var(--зелёный-фон)} .chip.с{color:var(--кмг-тёмный);background:var(--кмг-фон)}
.ист{display:inline-block;padding:2px 9px;border:1.5px solid var(--линия);border-radius:5px;font:600 15px var(--т);color:var(--чернила);background:#fff;white-space:nowrap}
.подр{display:inline-block;padding:1px 8px;border:1.5px solid var(--кмг);border-radius:5px;font:600 15px var(--т);color:var(--кмг-тёмный);background:var(--кмг-фон)}
.полоса{position:relative;height:16px;border:2px solid var(--чернила);border-radius:9px;overflow:hidden;background:#fff}
.полоса i{position:absolute;left:0;top:0;bottom:0;border-radius:0 6px 6px 0}
.событие{position:absolute;right:16px;top:68px;padding:6px 12px;border-radius:6px;background:var(--красный);color:#fff;font:700 16px var(--м);letter-spacing:.06em;white-space:nowrap}
.кн{display:flex;align-items:center;justify-content:center;height:52px;border-radius:7px;border:2px solid var(--кмг);color:var(--кмг-тёмный);font:600 18px var(--т);background:#fff;white-space:nowrap}
.кн.гл{background:var(--кмг);color:#fff}
/* интро и эффект: крупные числа */
.н-блок{position:absolute;transform-origin:0 0}
.н-число{font:900 260px/.95 var(--з);letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
.н-подп{font:700 44px/1.2 var(--п);color:#dfeaf3;margin-top:44px}
/* FAR: число + сравнение полос */
.far-лбл{font:700 24px var(--п);letter-spacing:.06em;text-transform:uppercase;color:#90D6F7}
.far-ряд{display:flex;align-items:baseline;gap:34px;margin-top:10px}
.far-число{font:900 230px/.95 var(--з);letter-spacing:-.03em;color:var(--красный);white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 0 70px rgba(255,40,70,.4)}
.far-бейдж{display:inline-block;padding:10px 22px;border-radius:10px;background:var(--красный);color:#fff;font:800 30px var(--п);white-space:nowrap;transform-origin:0 50%}
.far-полосы{margin-top:34px;display:grid;grid-template-columns:300px 1fr;gap:22px 26px;align-items:center;width:1180px}
.far-имя{font:700 28px var(--п);color:#dfeaf3;white-space:nowrap}
.far-дор{position:relative;height:38px;border-radius:8px;background:rgba(255,255,255,.07)}
.far-бар{position:absolute;left:0;top:0;height:100%;border-radius:8px;transform-origin:0 50%}
.far-бар.iogp{background:#1B8A4C;width:7%}
.far-бар.кмг{background:var(--красный);width:86.5%}
.far-зн{position:absolute;top:50%;transform:translateY(-50%);font:800 30px var(--м);color:#fff;white-space:nowrap}
.far-метка{position:absolute;top:-32px;left:32.2%;transform:translateX(-50%);font:600 22px var(--м);color:#9fb6c9;white-space:nowrap}
.far-метка::after{content:'';position:absolute;left:50%;top:30px;width:2px;height:52px;background:#9fb6c9;opacity:.8}
.far-подп{font:700 30px/1.25 var(--п);color:#9fb6c9;margin-top:36px}
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap" id="wrap">
    <div id="stage">
      <div id="layer"></div>
      <canvas id="fx" width="1920" height="1080"></canvas>
      <div id="метка"></div>
      <div id="tag"><i></i><b id="tagN"></b></div>
    </div>
  </div>
  <div class="panel">
    <div class="time"><span id="tc">000.00</span> <small>/ <span id="td"></span> c · кадр <span id="fc">0</span></small></div>
    <input type="range" id="scrub" min="0" step="0.001" value="0" aria-label="Время">
    <div class="btns">
      <button id="play">▶ Play</button><button id="restart">↺ Сначала</button><button id="rate">1×</button>
      <span style="align-self:center;color:var(--ui-dim)">Пробел · ←/→ кадр · Shift+←/→ 1 c</span>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<script type="module">
/* ---------- Математика времени ---------- */
const E = {
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t), outCubic: t => 1 - Math.pow(1 - t, 3), inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const typed = (s, p) => s.slice(0, Math.round(s.length * clamp01(p)));
const счёт = (v, знаков = 0) => v.toFixed(знаков).replace('.', ',');
const ЦВ = { к: '#C8102E', ж: '#D98E04', з: '#1B8A4C' };
const светофор = v => v >= 60 ? 'к' : v >= 30 ? 'ж' : 'з';           // пороги индекса: 60+ эскалация, 30+ инструктаж

/* =====================================================================
   ТАЙМЛАЙН. Длительности подобраны так, что каждая смена сцены после интро
   попадает на начало такта музыки (120 BPM, такт 2 c, сетка от 7 c).
   ===================================================================== */
const FPS = 30, W = 1920, H = 1080, ПЕРЕХОД = .7;
const СЦЕНЫ = [
  { id: 'интро',   длит: 9,  имя: 'Цифры',            подпись: '' },
  { id: 'контуры', длит: 10, имя: 'Контуры сегодня',  подпись: 'Четыре системы фиксируют нарушение, когда оно уже случилось' },
  { id: 'индекс',  длит: 10, имя: 'Индекс риска',     подпись: 'Индекс сводит их сигналы в одну оценку — до начала работ' },
  { id: 'мастер',  длит: 10, имя: 'Экран мастера',    подпись: 'Решение принимает человек' },
  { id: 'фото',    длит: 8,  имя: 'Фотопроверка',     подпись: 'Фотопроверка: сигнал там, где камер нет' },
  { id: 'дпб',     длит: 8,  имя: 'Экран ДПБ',        подпись: 'Служба ПБ видит своё ДЗО, ДПБ — сводку по группе' },
  { id: 'эффект',  длит: 10, имя: 'Эффект',           подпись: '* оценка автора, параметры открыты в прототипе' },
  { id: 'финал',   длит: 7,  имя: 'Финал',            подпись: '' }
];
let т = 0; СЦЕНЫ.forEach((с, i) => { с.t0 = т; с.t1 = т + с.длит + (i < СЦЕНЫ.length - 1 ? ПЕРЕХОД : 0); с.i = i; т += с.длит; });
const DUR = т;

/* Миры: светлая «бумага» КМГ и тёмный мир для интро и эффекта */
const ТЁМНЫЙ = 'radial-gradient(circle,rgba(144,214,247,.12) 1.6px,transparent 2.4px) 0 0/48px 48px,radial-gradient(ellipse at 50% 45%,#0b2a44,#04101c 78%)';
const СВЕТЛЫЙ = 'linear-gradient(rgba(2,174,240,.06) 1px,transparent 1px) 0 0/60px 60px,linear-gradient(90deg,rgba(2,174,240,.06) 1px,transparent 1px) 0 0/60px 60px,#F5F9FC';
const МИРЫ = {
  интро:   { bg: ТЁМНЫЙ,  acc: '#02AEF0', tag: '#e8f1f8', метка: '#90D6F7' },
  контуры: { bg: СВЕТЛЫЙ, acc: '#02AEF0', tag: '#231F20', метка: '#55606B' },
  индекс:  { bg: СВЕТЛЫЙ, acc: '#02AEF0', tag: '#231F20', метка: '#55606B' },
  мастер:  { bg: СВЕТЛЫЙ, acc: '#02AEF0', tag: '#231F20', метка: '#55606B' },
  фото:    { bg: СВЕТЛЫЙ, acc: '#02AEF0', tag: '#231F20', метка: '#55606B' },
  дпб:     { bg: СВЕТЛЫЙ, acc: '#02AEF0', tag: '#231F20', метка: '#55606B' },
  эффект:  { bg: ТЁМНЫЙ,  acc: '#02AEF0', tag: '#e8f1f8', метка: '#90D6F7' },
  финал:   { bg: СВЕТЛЫЙ, acc: '#02AEF0', tag: '#231F20', метка: '#55606B' }
};

/* ---------- Данные макетов (иллюстрация, обезличено) ---------- */
const ЦИФРЫ = [
  { ч: '10,38',  цв: 'var(--красный)', п: 'FAR подрядных организаций, 2025' },
  { ч: '1 из 3', цв: 'var(--янтарь)',  п: 'несчастных случаев — на работах повышенной опасности' },
  { ч: '3',      цв: 'var(--красный)', п: 'смертельных случая за полгода 2026' }
];
const ФАКТОРЫ = [
  ['Заходы в опасную зону при СПО', 'TUMAR', 23], ['Нарушения СИЗ за 7 смен', 'TUMAR', 19],
  ['Инциденты на объекте за 24 мес', 'Реестр', 19], ['Фотопроверка не пройдена', 'Фото', 15], ['Незакрытые Қорғау', 'Қорғау', 11]
];
const НАРЯДЫ = [
  ['к', 'НД-3321', 'Работы на высоте', 'ПСП-5', 'КРС-02', 0, '08:00', 87], ['к', 'НД-2527', 'СПО', 'ПСП-2', 'КРС-06', 1, '08:00', 85],
  ['к', 'НД-2598', 'ПРС скважины', 'ПСП-13', 'ПРС-11', 0, '08:30', 62], ['к', 'НД-2986', 'Работы на высоте', 'ПСП-7', 'КРС-04', 0, '08:30', 62],
  ['ж', 'НД-3356', 'Газоопасные работы', 'ПСП-3', 'ПРС-17', 1, '08:30', 58], ['ж', 'НД-2640', 'КРС', 'ПСП-2', 'ПРС-12', 1, '08:00', 57],
  ['ж', 'НД-2794', 'ПРС', 'ПСП-8', 'ЭТБ-15', 0, '08:30', 55]
];
const СВЕТ_ИМЯ = { к: 'Эскалация', ж: 'Инструктаж', з: 'Допуск' };
const МЕРЫ = ['1. Разметить опасную зону при СПО, назначить наблюдающего',
  '2. Целевой инструктаж по СИЗ с разбором кадров бригады', '3. Повторить фотопроверку места работ перед допуском'];
const ДЗО = [['ОМГ', 59, 151, 5, 23, ['ЭНД', 'TUMAR', 'Поездки', 'Қорғау']], ['ММГ', 46, 109, 2, 12, ['ЭНД', 'Поездки', 'Қорғау']],
  ['КБМ', 72, 86, 3, 15, ['ЭНД', 'TUMAR', 'Поездки']], ['ЭМГ', 63, 96, 2, 16, ['Поездки', 'Қорғау']],
  ['ОСК', 62, 126, 3, 20, ['TUMAR', 'Поездки', 'Қорғау']], ['ОМС', 56, 111, 4, 12, ['TUMAR', 'Поездки']], ['ОТК', 62, 87, 2, 14, ['Поездки', 'Қорғау']]];
const ТЕПЛО = [['ПСП-1', [4, 2, 0, 5, 5, 3], 85], ['ПСП-8', [2, 2, 0, 2, 3, 4], 63], ['ПСП-16', [0, 5, 4, 2, 1, 0], 61], ['ПСП-15', [3, 4, 3, 0, 2, 1], 58]];
const ЯЧЕЙКА = ['#EEF2F5', '#E6F4EC', '#FFF4DB', '#FDD9A0', '#F6B8C2', '#C8102E'];
// sparkline ДЗО: 14 точек, детерминированно от номера карточки; в конце — всплеск у красных
const искра = (k, v) => Array.from({ length: 14 }, (_, j) => 28 + 7 * Math.sin(j * .9 + k * 1.7) + 4 * Math.sin(j * 2.3 + k) + (j === 13 && v >= 60 ? 16 : 0));
const путьИскры = (k, v, w, h) => искра(k, v).map((y, j) => `${j ? 'L' : 'M'}${(j * w / 13).toFixed(1)},${(h - y * h / 60).toFixed(1)}`).join(' ');

const угол = `<img class="лого-угол" src="assets/лого_кмг.png" alt="">`;
const ПОЛОЖЕНИЕ = [100, 550, 1000, 1450];        // окна четырёх систем в сцене «контуры»

/* окна четырёх систем — одна разметка: в «контурах» крупно, в «индексе» мелко по углам */
const окноЭНД = (мал) => `<div class="wbar"><i></i>${мал ? 'ЭНД' : 'ЭНД · наряды'}</div>` + (мал
  ? `<div class="abs" style="left:20px;top:74px"><div style="font:700 30px var(--м)">НД-3321</div><div style="font:600 18px var(--т);margin-top:6px;color:var(--второй)">наряд выдан · 07:52</div></div>`
  : `<div class="событие">СОБЫТИЕ 07:52</div>
     <div class="abs" style="left:24px;right:24px;top:130px"><div class="k-lbl">Наряд-допуск</div>
       <div style="font:700 46px var(--м);margin-top:8px">НД-3321</div>
       <div style="font:600 22px/1.3 var(--т);margin-top:16px">Работы на высоте — эстакада</div>
       <div style="font:500 18px var(--т);color:var(--второй);margin-top:8px">ПСП-5 · бригада КРС-02 · 7 чел.</div>
       <div style="margin-top:40px;display:flex;align-items:center;gap:14px"><span class="k-lbl">Статус</span><span class="chip с">выдан</span></div>
       <div style="font:500 18px var(--т);color:var(--второй);margin-top:22px">Инструктаж: отметка в журнале</div></div>`);
const кадрКамеры = (w, h, рамка) => `<svg width="${w}" height="${h}" viewBox="0 0 322 220" style="display:block;border-radius:8px;background:#1c2a36">
    <rect x="0" y="168" width="322" height="52" fill="#34444f"/>
    <rect x="22" y="96" width="190" height="9" fill="#7f95a5"/><rect x="40" y="105" width="8" height="63" fill="#7f95a5"/><rect x="186" y="105" width="8" height="63" fill="#7f95a5"/>
    <line x1="48" y1="168" x2="186" y2="110" stroke="#5f7383" stroke-width="4"/>
    <rect x="246" y="98" width="26" height="40" rx="4" fill="#e8792b"/>
    <rect x="248" y="112" width="22" height="4" fill="#f3f3f3"/><rect x="248" y="122" width="22" height="4" fill="#f3f3f3"/>
    <line x1="252" y1="138" x2="250" y2="168" stroke="#2c3a46" stroke-width="7"/><line x1="266" y1="138" x2="268" y2="168" stroke="#2c3a46" stroke-width="7"/>

    q.т.forEach((r, i) => r.style.opacity = prog(lt, 2.0 + i * .15, 2.4 + i * .15));
    // карточка урока летит из правого верхнего угла по дуге
    const m = E.outCubic(prog(lt, 3.3, 4.6)), x = lerp(700, 0, m), y = lerp(-760, 0, m) - Math.sin(Math.PI * m) * 120;
    q.у.style.opacity = prog(lt, 3.3, 3.5); q.у.style.transform = `translate(${x}px,${y}px) rotate(${lerp(14, 0, m)}deg) scale(${lerp(.7, 1, m)})`;
  },

  эффект(el, lt, q) {
    q.гч ||= el.querySelector('.гч'); q.гн ||= el.querySelector('.г-число'); q.гп ||= el.querySelector('.гп'); q.ярл ||= el.querySelector('.ярл');
    q.сл ||= $$(el, '.сл'); q.ден ||= el.querySelector('.деньги');
    if (q.w === undefined) { q.гн.textContent = '1,8'; q.w = q.гн.offsetWidth; }       // ширина итогового числа — константа вёрстки
    мир(el).style.backgroundPosition = `${-lt * 8}px ${-lt * 4}px, 0 0`;
    // герой «1,8» (×2) в центре → садится в первую ячейку ряда (×1)
    const m = E.inOutCubic(prog(lt, 3.4, 4.3)), sc = pop(q.гч, lt, .3, .6, .7);
    const s = lerp(2, 1, m) * sc, x = lerp(820 - q.w, 0, m) + (1 - sc) * q.w, y = lerp(-110, 0, m) + (1 - sc) * 143;
    q.гч.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    q.гн.textContent = счёт(lerp(0, 1.8, E.outCubic(prog(lt, .35, 1.8))), 1);
    q.гп.style.opacity = prog(lt, 1.0, 1.5) * (1 - prog(lt, 3.1, 3.5)); q.гп.style.transform = `translateY(${(1 - E.outCubic(prog(lt, 1.0, 1.6))) * 30}px)`;
    q.ярл.style.transform = `translateY(${выезд(q.ярл, lt, 4.1, .5, 20)}px)`;
    q.сл[0].querySelector('.сп').style.opacity = prog(lt, 4.2, 4.7);
    [[4.6, 7, '≈ '], [5.4, 20, '> ']].forEach(([at, v, пр], k) => { const b = q.сл[k + 1], sc2 = pop(b, lt, at, .6, .6);
      b.style.transformOrigin = '0 30%'; b.style.transform = `scale(${sc2})`;
      b.firstElementChild.textContent = пр + Math.round(lerp(0, v, E.outCubic(prog(lt, at, at + 1.0)))); });
    q.ден.style.transform = `translateY(${выезд(q.ден, lt, 6.8, .7, 30)}px)`;
  },

  финал(el, lt, q) {
    q.л ||= el.querySelector('.ф-лого'); q.п ||= el.querySelector('.ф-пол'); q.с ||= $$(el, '.ф-с');
    q.л.style.transform = `scale(${pop(q.л, lt, .3, .8, .6)})`;
    q.п.style.transform = `scaleX(${E.outExpo(prog(lt, .9, 1.7))})`;
    q.с.forEach((s, i) => s.style.transform = `translateY(${выезд(s, lt, 1.3 + i * .45, .7, 30)}px)`);
  }
};

/* ---------- Сборка ---------- */
const stage = document.getElementById('stage'), layer = document.getElementById('layer');
const ITEMS = СЦЕНЫ.map(с => {
  const el = document.createElement('div'); el.className = 'item'; const м = МИРЫ[с.id]; el.style.setProperty('--bg', м.bg);
  el.innerHTML = `<div class="world" style="--bg:${м.bg};--acc:${м.acc}">${МАКЕТЫ[с.id]}</div>`;
  layer.appendChild(el); return { ...с, el, on: false, q: {} };
});

/* ---------- canvas: расходящиеся кольца «радара» в интро ---------- */
const cx = document.getElementById('fx').getContext('2d');
function фон(t) {
  cx.clearRect(0, 0, W, H);
  if (t > 8.6) return;
  const a = prog(t, 0, 1) * (1 - prog(t, 7.6, 8.6));
  for (let k = 0; k < 5; k++) { const u = ((t * .22) + k / 5) % 1;
    cx.beginPath(); cx.arc(1250, 450, 120 + u * 900, 0, Math.PI * 2);
    cx.strokeStyle = `rgba(144,214,247,${.10 * (1 - u) * a})`; cx.lineWidth = 2; cx.stroke(); }
}

/* ---------- Кадр ---------- */
const tag = document.getElementById('tag'), tagN = document.getElementById('tagN'), метка = document.getElementById('метка');
function renderAt(t) {
  t = Math.min(Math.max(t, 0), DUR - 1e-4);
  let cur = null;
  for (const it of ITEMS) {
    const on = t >= it.t0 && t < it.t1;
    if (on !== it.on) { it.el.classList.toggle('on', on); it.on = on; }
    if (!on) continue;
    const lt = t - it.t0;
    const pr = it.i ? E.inOutCubic(prog(lt, 0, ПЕРЕХОД)) : 1;
    it.el.style.clipPath = pr < 1 ? `circle(${pr * 1200}px at 960px 540px)` : 'none';
    const out = it.i < ITEMS.length - 1 ? prog(t, it.t1 - ПЕРЕХОД, it.t1) : 0;
    it.el.firstChild.style.transform = out ? `scale(${1 - .06 * out})` : '';
    АНИМАЦИЯ[it.id](it.el, lt, it.q, it);
    if (lt > ПЕРЕХОД * .5) cur = it;
  }
  const вид = cur && cur.подпись && t - cur.t0 > .9 && t < cur.t1 - ПЕРЕХОД * .6;
  tag.style.opacity = вид ? prog(t - cur.t0, .9, 1.3) : 0;
  метка.style.opacity = вид ? prog(t - cur.t0, .9, 1.3) : 0;
  if (cur) { const м = МИРЫ[cur.id]; tagN.textContent = cur.подпись; tag.style.color = м.tag; метка.style.color = м.метка;
    метка.textContent = `${String(cur.i + 1).padStart(2, '0')} / ${String(СЦЕНЫ.length).padStart(2, '0')} · ${cur.имя}`; }
  фон(t);
}

// Готовность: ровно те шрифты, что в кадре, и логотип
const ready = (async () => {
  try { await Promise.all(['900 40px "Inter Tight"', '700 40px "Jost"', '800 40px "Jost"', '500 16px "JetBrains Mono"', '700 16px "JetBrains Mono"',
    '500 20px "Onest"', '600 20px "Onest"', '800 20px "Onest"'].map(f => document.fonts.load(f, 'АБВ abc 123'))); await document.fonts.ready; } catch (e) {}
  const лого = new Image(); лого.src = 'assets/лого_кмг.png'; try { await лого.decode(); } catch (e) {}
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  renderAt(0);
})();
window.__story = { duration: DUR, fps: FPS, width: W, height: H, renderAt, ready };

/* ---------- Плеер ---------- */
const $ = id => document.getElementById(id), wrap = $('wrap');
if (new URLSearchParams(location.search).has('render')) { document.body.classList.add('render'); wrap.style.width = W + 'px'; wrap.style.height = H + 'px'; }
else {
  let t = 0, playing = false, last = performance.now(), rate = 1, dirty = true;
  $('td').textContent = DUR.toFixed(2); $('scrub').max = DUR;
  СЦЕНЫ.forEach(с => { const s = document.createElement('span'); s.textContent = с.имя || с.id; s.onclick = () => { t = с.t0 + .01; dirty = true; }; $('chips').appendChild(s); });
  const chips = [...$('chips').children];
  const layout = () => { const s = Math.min((innerWidth - 32) / W, (innerHeight - $('chips').parentElement.offsetHeight - 48) / H); wrap.style.width = W * s + 'px'; wrap.style.height = H * s + 'px'; stage.style.transform = `scale(${s})`; };
  addEventListener('resize', layout); layout();
  const setPlay = p => { playing = p; $('play').textContent = p ? '❚❚ Пауза' : '▶ Play'; };
  $('play').onclick = () => setPlay(!playing); $('restart').onclick = () => { t = 0; dirty = true; setPlay(true); };
  $('rate').onclick = () => { rate = rate === 1 ? .5 : rate === .5 ? .25 : 1; $('rate').textContent = rate + '×'; };
  $('scrub').oninput = e => { t = +e.target.value; dirty = true; setPlay(false); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); setPlay(false); t = Math.min(DUR - 1 / FPS, Math.max(0, t + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / FPS))); dirty = true; }
  });
  ready.then(() => { (function tick(now) {
    const dt = (now - last) / 1000; last = now;
    if (playing) { t += dt * rate; if (t >= DUR - 1 / FPS) { t = DUR - 1 / FPS; setPlay(false); } dirty = true; }
    if (dirty) { renderAt(t); dirty = false; $('tc').textContent = t.toFixed(2).padStart(6, '0'); $('fc').textContent = Math.floor(t * FPS); $('scrub').value = t;
      chips.forEach((c, i) => c.classList.toggle('on', t >= СЦЕНЫ[i].t0 && (i === СЦЕНЫ.length - 1 || t < СЦЕНЫ[i + 1].t0))); }
    requestAnimationFrame(tick); })(performance.now()); });
}
</script>
